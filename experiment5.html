<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <feildset>
        <form action="#">
            <h1 align="center">Home Booking</h1>
            <label for="name">Full name:</label>
            <input type="text" name="name" id="name" placeholder="enter your name">
            <br><br>
            <label for="email id">Email id:</label>
            <input type="email id" name="email" id="email">
            <br><br>
            <label type="mobile number">Phone:</label>
            <input type="tel" name="tel" id="tel">
            <br><br>
            <label for="dob">Check-in Date:</label>
            <input type="Date" name="dob" id="dob">
            <br><br>
            <label for="dob">Check-out Date:</label>
            <input type="Date" name="dob" id="dob">
            <br><br>
            <label for="room">Room Type:</label>
            <select name="room" id="room">
                <option value="Single room">Single room</option>
                <option value ="Double room">Double room</option>
            </select>
            <br><br>
            <label for="guest">Number of guest:</label>
            <input type="number" name="number" id="number">
            <br><br>
            <label for="request">Special Request:</label>
            <textarea name="request" id="request">
            </textarea>
            <br><br>
            <input type="submit" value="Booknow">&nbsp;
            <input type="reset" value="reset form">

        </form>

    </feildset>
    
</body>
</html>
